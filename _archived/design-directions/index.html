<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIISC · 三种视觉方向</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; color: #24252a; background: #fafafa; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #2457f5; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .toolbar { padding: 20px 32px 0; background: #fff; border-bottom: 1px solid #dedfe4; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 17px; letter-spacing: -.4px; font-weight: 600; }
    h1 span { margin-right: 14px; font-size: 11px; letter-spacing: 2px; }
    .heading > p { margin: 0; color: #686b75; font-size: 11px; line-height: 1.7; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 1080px; }
    .choice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #e2e3e8; border-radius: 5px; background: #fafafa; text-align: left; color: #34363d; }
    .choice:hover { border-color: #9a9ca6; }
    .choice[aria-selected="true"] { border-color: #252831; background: #f2f3f6; box-shadow: inset 0 0 0 1px #252831; }
    .swatch { display: grid; grid-template-columns: 1fr 1fr; width: 30px; height: 32px; flex-shrink: 0; border: 1px solid #dddfe5; }
    .swatch i { display: block; }
    .choice strong { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
    .choice small { display: block; color: #696d78; font-size: 10px; line-height: 1.5; }
    .context { display: flex; justify-content: space-between; align-items: center; gap: 24px; min-height: 44px; padding: 10px 0; }
    .context p { margin: 0; font-size: 11px; color: #616570; line-height: 1.7; }
    .context a { flex-shrink: 0; font-size: 11px; font-weight: 500; border-bottom: 1px solid #b4b7c0; padding-bottom: 3px; }
    .preview { height: calc(100dvh - 196px); min-height: 600px; background: white; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    noscript p { margin: 16px 32px; line-height: 2; }
    noscript a { text-decoration: underline; }
    @media (max-width: 700px) {
      .toolbar { padding: 16px 16px 0; }
      .heading { margin-bottom: 14px; }
      .heading > p { display: none; }
      h1 { font-size: 15px; }
      h1 span { font-size: 10px; margin-right: 10px; }
      .choices { gap: 7px; }
      .choice { gap: 6px; padding: 11px 7px; }
      .swatch { width: 12px; height: 26px; }
      .choice strong { font-size: 11px; margin-bottom: 0; }
      .choice small { display: none; }
      .context { gap: 14px; min-height: 62px; }
      .context p { font-size: 10px; }
      .context a { font-size: 10px; }
      .preview { height: calc(100dvh - 167px); min-height: 650px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="heading">
      <h1><span>AIISC / DESIGN STUDIES</span>三种视觉方向</h1>
      <p>同一个社团，三种表达。切换查看完整首页样稿。</p>
    </div>
    <div class="choices" role="tablist" aria-label="选择视觉方向">
      <button class="choice" id="tab-lab" type="button" role="tab" aria-controls="panel-lab" aria-selected="true" tabindex="0" data-direction="lab">
        <span class="swatch" aria-hidden="true"><i style="background:#f5f7fc"></i><i style="background:#2457f5"></i></span>
        <span><strong>A · 交叉实验室</strong><small>学术感 / 开放 / 清晰</small></span>
      </button>
      <button class="choice" id="tab-terminal" type="button" role="tab" aria-controls="panel-terminal" aria-selected="false" tabindex="-1" data-direction="terminal">
        <span class="swatch" aria-hidden="true"><i style="background:#101217"></i><i style="background:#85caff"></i></span>
        <span><strong>B · 研究终端</strong><small>技术感 / 深度 / 探索</small></span>
      </button>
      <button class="choice" id="tab-bulletin" type="button" role="tab" aria-controls="panel-bulletin" aria-selected="false" tabindex="-1" data-direction="bulletin">
        <span class="swatch" aria-hidden="true"><i style="background:#f4f3ee"></i><i style="background:#ec4b2f"></i></span>
        <span><strong>C · 实验公报</strong><small>创作感 / 大胆 / 有活力</small></span>
      </button>
    </div>
    <div class="context">
      <p id="direction-description" role="status">白底电蓝、学科关系图与精确网格。适合把「AI × 不同学科」作为社团的第一印象。</p>
      <a id="open-direction" href="lab.html" target="_blank" rel="noopener">完整打开 A ↗</a>
    </div>
  </header>
  <main>
    <section class="preview" id="panel-lab" role="tabpanel" aria-labelledby="tab-lab">
      <iframe src="lab.html" title="方向 A：交叉实验室首页预览"></iframe>
    </section>
    <section class="preview" id="panel-terminal" role="tabpanel" aria-labelledby="tab-terminal" hidden>
      <iframe data-src="terminal.html" title="方向 B：研究终端首页预览"></iframe>
    </section>
    <section class="preview" id="panel-bulletin" role="tabpanel" aria-labelledby="tab-bulletin" hidden>
      <iframe data-src="bulletin.html" title="方向 C：实验公报首页预览"></iframe>
    </section>
  </main>
  <noscript><p>直接查看：<a href="lab.html">A · 交叉实验室</a> / <a href="terminal.html">B · 研究终端</a> / <a href="bulletin.html">C · 实验公报</a></p></noscript>
  <script>
    (() => {
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const descriptions = {
        lab: '白底电蓝、学科关系图与精确网格。适合把「AI × 不同学科」作为社团的第一印象。',
        terminal: '石墨黑、冰蓝细线与活动日志。突出技术探索与持续讨论，更接近开放研究工作台。',
        bulletin: '朱红橙、大字海报与编辑式分栏。突出学生社团的创造力，以及从问题到作品的行动。'
      };
      function select(direction, updateURL = true) {
        const active = tabs.find(tab => tab.dataset.direction === direction) || tabs[0];
        direction = active.dataset.direction;
        tabs.forEach(tab => {
          const selected = tab === active;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
          const panel = document.getElementById(tab.getAttribute('aria-controls'));
          panel.hidden = !selected;
          const frame = panel.querySelector('iframe');
          if (selected && frame.dataset.src) { frame.src = frame.dataset.src; delete frame.dataset.src; }
        });
        document.getElementById('direction-description').textContent = descriptions[direction];
        const link = document.getElementById('open-direction');
        link.href = direction + '.html';
        link.textContent = '完整打开 ' + ['A', 'B', 'C'][tabs.indexOf(active)] + ' ↗';
        if (updateURL) {
          try { history.replaceState(null, '', '#' + direction); } catch { /* Local-file previews still work. */ }
        }
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => select(tab.dataset.direction));
        tab.addEventListener('keydown', event => {
          let next;
          if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
          if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          if (next === undefined) return;
          event.preventDefault();
          tabs[next].focus();
          select(tabs[next].dataset.direction);
        });
      });
      window.addEventListener('hashchange', () => select(location.hash.slice(1), false));
      select(location.hash.slice(1), false);
    })();
  </script>
</body>
</html>
